name: Automated Daily Jekyll Rebuild
on:
  schedule:
    # Run every day at 12:00 AM UTC (7:00 or 8:00 PM EST)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  jekyll-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitHub Pages rebuild via empty commit
        run: |
          git clone "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Trigger Jekyll rebuild for scheduled posts"
          git push
